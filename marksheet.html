<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marksheet | Madrasa-E Nurul Quran</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="assets/css/admin.css">

<link rel="stylesheet" href="assets/css/marksheet.css">

</head>

<body>

<div class="dashboard">

<aside class="sidebar">

<div class="brand">

<img src="assets/img/logo.png">

<h3>মাদরাসায়ে নূরুল কুরআন</h3>

</div>

<ul>

<li><a href="admin.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>

<li><a href="results.html"><i class="fa-solid fa-square-poll-vertical"></i> Results</a></li>

<li><a class="active" href="marksheet.html"><i class="fa-solid fa-file-lines"></i> Marksheet</a></li>

<li><a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>

</ul>

</aside>

<main class="main-content">

<div class="topbar">

<h2>Student Marksheet</h2>

</div>

<div class="dashboard-card">

<div class="row">

<div class="col-md-5">

<label>Student ID</label>

<input
id="studentId"
class="form-control"
placeholder="Student ID">

</div>

<div class="col-md-5">

<label>Exam Name</label>

<input
id="examName"
class="form-control"
placeholder="Exam Name">

</div>

<div class="col-md-2 d-grid">

<label>&nbsp;</label>

<button
id="loadMarksheet"
class="btn btn-success">

Load

</button>

</div>

</div>

</div>

<div class="dashboard-card">

<div class="row">

<div class="col-md-2 text-center">

<img
id="studentPhoto"
src="assets/img/avatar.png"
style="width:120px;height:120px;border-radius:50%;object-fit:cover;">

</div>

<div class="col-md-10">

<h3 id="studentName">Student Name</h3>

<p>ID :
<span id="studentCode">-</span></p>

<p>Class :
<span id="studentClass">-</span></p>

<p>Father :
<span id="fatherName">-</span></p>

</div>

</div>

</div>
<!-- Subject Result -->

<div class="dashboard-card">

<div class="table-responsive">

<table class="table table-bordered">

<thead>

<tr>

<th>Subject</th>

<th>Full Marks</th>

<th>Obtained</th>

<th>Grade</th>

<th>GPA</th>

</tr>

</thead>

<tbody id="marksTable">

<tr>

<td colspan="5" class="text-center">

No Data

</td>

</tr>

</tbody>

<tfoot>

<tr>

<th colspan="2">Total</th>

<th id="totalMarks">0</th>

<th id="finalGrade">-</th>

<th id="finalGPA">0.00</th>

</tr>

</tfoot>

</table>

</div>

<div class="text-end mt-4">

<button
class="btn btn-primary"
onclick="window.print()">

<i class="fa-solid fa-print"></i>

Print Marksheet

</button>

</div>

</div>

</main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase.js"></script>

<script src="assets/js/marksheet.js"></script>

</body>

</html>
