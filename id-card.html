<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student ID Card | Madrasa-E Nurul Quran</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase.js"></script>

<style>

:root{

--primary:#0D6EFD;
--secondary:#0F172A;
--success:#198754;
--border:#d1d5db;

}

body{

font-family:'Hind Siliguri',sans-serif;
background:#ececec;
padding:30px;

}

.print-toolbar{

text-align:center;
margin-bottom:20px;

}

.id-wrapper{

display:flex;
gap:25px;
justify-content:center;
flex-wrap:wrap;

}

.id-card{

width:340px;
height:540px;
background:#fff;
border-radius:18px;
overflow:hidden;
box-shadow:0 8px 25px rgba(0,0,0,.15);
border:2px solid var(--primary);
position:relative;

}

.front-header{

background:var(--primary);
color:#fff;
padding:15px;
text-align:center;

}

.front-header img{

width:65px;
height:65px;
object-fit:contain;
margin-bottom:8px;

}

.front-header h4{

margin:0;
font-size:22px;
font-weight:700;

}

.front-header p{

margin:4px 0 0;
font-size:13px;

}

.student-photo{

width:120px;
height:140px;
margin:20px auto 10px;
display:block;
border:4px solid #fff;
outline:2px solid var(--primary);
border-radius:10px;
object-fit:cover;

}

.info{

padding:15px 20px;

}

.info table{

width:100%;
font-size:14px;

}

.info td{

padding:6px 0;
vertical-align:top;

}

.footer{

position:absolute;
bottom:15px;
left:0;
right:0;
text-align:center;

}

.qr{

width:80px;
height:80px;

}

.signature{

margin-top:10px;
font-size:13px;
border-top:1px solid #000;
display:inline-block;
padding-top:5px;

}

@media print{

.print-toolbar{

display:none;

}

body{

background:#fff;
padding:0;

}

.id-card{

box-shadow:none;

}

}

</style>

</head>

<body>

<div class="print-toolbar">

<button onclick="window.print()" class="btn btn-success">

<i class="fa-solid fa-print"></i>

Print ID Card

</button>

</div>

<div class="id-wrapper">

<div class="id-card" id="frontCard">

<!-- Front Card -->

</div>

<div class="id-card" id="backCard">

<!-- Back Card -->

</div>

</div>

<script src="assets/js/id-card.js"></script>

</body>

</html>
