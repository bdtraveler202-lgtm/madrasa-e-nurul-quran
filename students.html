<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Student Management | মাদরাসায়ে নূরুল কুরআন</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

body{
    background:#f5f7fb;
}

.card{
    border:none;
    border-radius:15px;
}

.student-photo{
    width:60px;
    height:60px;
    object-fit:cover;
    border-radius:50%;
}

.table td,
.table th{
    vertical-align:middle;
}

</style>

</head>

<body>

<div class="container py-5">

<div class="d-flex justify-content-between align-items-center mb-4">

<h2>

🎓 Student Management

</h2>

<a
href="admin.html"
class="btn btn-success">

<i class="fa fa-arrow-left"></i>

Dashboard

</a>

</div>

<div class="row mb-4">

<div class="col-md-3">

<div class="card shadow">

<div class="card-body text-center">

<h6>Total Students</h6>

<h2 id="totalStudents">

0

</h2>

</div>

</div>

</div>

<div class="col-md-5">

<input
type="text"
id="searchStudent"
class="form-control"
placeholder="Search Student...">

</div>

<div class="col-md-4">

<select
id="classFilter"
class="form-select">

<option value="">All Classes</option>

<option>নূরানী</option>

<option>১ম শ্রেণি</option>

<option>২য় শ্রেণি</option>

<option>৩য় শ্রেণি</option>

<option>৪র্থ শ্রেণি</option>

<option>৫ম শ্রেণি</option>

<option>নাজেরা</option>

<option>হিফজ</option>

</select>

</div>

</div>

<div class="table-responsive">

<table class="table table-bordered table-hover">

<thead class="table-success">

<tr>

<th>Photo</th>

<th>Student ID</th>

<th>Name</th>

<th>Class</th>

<th>Mobile</th>

<th>Status</th>

<th width="220">

Action

</th>

</tr>

</thead>

<tbody id="studentTable">

<tr>

<td colspan="7"
class="text-center">

Loading Students...

</td>

</tr>

</tbody>

</table>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/supabase.js"></script>

<script src="assets/students.js"></script>

</body>

</html>
