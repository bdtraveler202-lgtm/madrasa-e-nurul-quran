<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admission Application Form | Madrasa-E Nurul Quran</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase.js"></script>

<style>

body{

background:#ececec;

font-family:Arial,sans-serif;

padding:20px;

}

.paper{

width:210mm;

min-height:297mm;

margin:auto;

background:#fff;

padding:30px;

border:2px solid #000;

}

.header{

display:flex;

justify-content:space-between;

align-items:center;

border-bottom:3px solid #000;

padding-bottom:15px;

margin-bottom:20px;

}

.logo{

width:90px;

height:90px;

}

.photo{

width:120px;

height:140px;

border:1px solid #000;

object-fit:cover;

}

.title{

flex:1;

text-align:center;

}

.title h2{

font-weight:bold;

margin:0;

}

.title h5{

margin-top:8px;

}

.section{

background:#0d6efd;

color:#fff;

padding:8px 12px;

margin-top:20px;

font-weight:bold;

}

table{

width:100%;

border-collapse:collapse;

}

td{

border:1px solid #999;

padding:8px;

}

.signature{

display:flex;

justify-content:space-between;

margin-top:80px;

}

.signature div{

width:30%;

text-align:center;

border-top:1px solid #000;

padding-top:10px;

}

.print-btn{

margin-bottom:20px;

text-align:center;

}

@media print{

.print-btn{

display:none;

}

body{

background:#fff;

padding:0;

}

.paper{

border:none;

}

}

</style>

</head>

<body>

<div class="print-btn">

<button onclick="window.print()" class="btn btn-success">

<i class="fa-solid fa-print"></i>

Print

</button>

</div>

<div class="paper">

<div class="header">

<img src="assets/img/logo.png" class="logo">

<div class="title">

<h2>মাদরাসা-ই নূরুল কুরআন</h2>

<h5>Admission Application Form</h5>

<p>

Vollobpur, Dighuli, Chandraganj, Lakshmipur

</p>

</div>

<img id="studentPhoto" class="photo">

</div>

<div id="applicationData">

Loading...

</div>

</div>

<script src="assets/js/application-form.js"></script>

</body>

</html>
