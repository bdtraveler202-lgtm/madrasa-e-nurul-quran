<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Students | Madrasa ERP</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="assets/css/admin.css">

<link rel="stylesheet" href="assets/css/students.css">

</head>

<body>

<div class="dashboard">

<!-- Sidebar -->

<aside class="sidebar">

<div class="brand">

<img src="assets/img/logo.png">

<h3>Madrasa ERP</h3>

</div>

<ul>

<li><a href="admin.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>

<li><a class="active"><i class="fa-solid fa-user-graduate"></i> Students</a></li>

<li><a href="teachers.html"><i class="fa-solid fa-chalkboard-user"></i> Teachers</a></li>

<li><a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>

</ul>

</aside>

<!-- Main -->

<main class="main-content">

<div class="topbar">

<h2>Student Management</h2>

<div>

<button
class="btn btn-success"
data-bs-toggle="modal"
data-bs-target="#studentModal">

<i class="fa-solid fa-plus"></i>

New Student

</button>

</div>

</div>

<div class="dashboard-card mb-4">

<div class="row">

<div class="col-lg-4">

<input
id="searchStudent"
class="form-control"
placeholder="Search by Student ID / Name / Mobile">

</div>

<div class="col-lg-3">

<select
id="classFilter"
class="form-select">

<option value="">All Classes</option>

<option>নূরানী</option>

<option>নাজেরা</option>

<option>হিফজ</option>

</select>

</div>

<div class="col-lg-2">

<button
class="btn btn-success w-100"
id="searchBtn">

Search

</button>

</div>

</div>

</div>

<div class="dashboard-card">

<div class="table-responsive">

<table class="table table-hover align-middle">

<thead>

<tr>

<th>ID</th>

<th>Photo</th>

<th>Name</th>

<th>Class</th>

<th>Mobile</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="studentTable">

</tbody>

</table>

</div>

</div>

</main>

</div>

<!-- Student Modal -->

<div class="modal fade" id="studentModal">

<div class="modal-dialog modal-xl">

<div class="modal-content">

<div class="modal-header">

<h5>New Student Registration</h5>

<button
class="btn-close"
data-bs-dismiss="modal">

</button>

</div>

<div class="modal-body">

<form id="studentForm">

<div class="row">

<div class="col-md-4 mb-3">

<label>Student Name</label>

<input
id="studentName"
class="form-control"
required>

</div>

<div class="col-md-4 mb-3">

<label>Father Name</label>

<input
id="fatherName"
class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>Mother Name</label>

<input
id="motherName"
class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>Mobile</label>

<input
id="studentMobile"
class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>Class</label>

<select
id="studentClass"
class="form-select">

<option>নূরানী</option>

<option>নাজেরা</option>

<option>হিফজ</option>

</select>

</div>

<div class="col-md-4 mb-3">

<label>Photo</label>

<input
type="file"
id="studentPhoto"
class="form-control">

</div>

<div class="col-12">

<button
class="btn btn-success">

Save Student

</button>

</div>

</div>

</form>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase.js"></script>

<script src="assets/js/students.js"></script>

</body>

</html>
