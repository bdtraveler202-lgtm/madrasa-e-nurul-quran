<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MNQ | Student Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="assets/css/admin.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase.js"></script>

</head>

<body>

<div class="dashboard">

<!-- Sidebar -->

<aside class="sidebar">

<div class="brand">

<img src="assets/img/logo.png">

<h3>মাদরাসা-ই নূরুল কুরআন</h3>

</div>

<ul class="sidebar-menu">

<li><a href="admin.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>

<li><a class="active" href="students.html"><i class="fa-solid fa-user-graduate"></i> Students</a></li>

<li><a href="teachers.html"><i class="fa-solid fa-chalkboard-user"></i> Teachers</a></li>

<li><a href="employees.html"><i class="fa-solid fa-users"></i> Employees</a></li>

<li><a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>

</ul>

</aside>

<!-- Main -->

<main class="main-content">

<div class="dashboard-card">

<h3 class="mb-4">

<i class="fa-solid fa-user-plus"></i>

Student Registration Form

</h3>

<form id="studentForm" enctype="multipart/form-data">

<div class="row">

<div class="col-md-3 mb-3">

<label class="form-label">

Student ID

</label>

<input
type="text"
id="studentID"
class="form-control"
readonly>

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Admission Date

</label>

<input
type="date"
id="admissionDate"
class="form-control">

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Session

</label>

<input
type="text"
id="session"
class="form-control"
placeholder="2026">

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Student Photo

</label>

<input
type="file"
id="photo"
accept="image/*"
class="form-control">

</div>
<div class="col-md-6 mb-3">

<label class="form-label">

Student Name (বাংলা)

</label>

<input
type="text"
id="studentNameBn"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Student Name (English)

</label>

<input
type="text"
id="studentNameEn"
class="form-control">

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Department

</label>

<select
id="department"
class="form-select"
required>

<option value="">Select</option>

<option value="Nurani">Nurani</option>

<option value="Nazera">Nazera</option>

<option value="Hifz">Hifz</option>

<option value="Kitab">Kitab</option>

</select>

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Class

</label>

<select
id="studentClass"
class="form-select"
required>

<option value="">Select Class</option>

</select>

</div>

<div class="col-md-2 mb-3">

<label class="form-label">

Roll

</label>

<input
type="number"
id="roll"
class="form-control">

</div>

<div class="col-md-2 mb-3">

<label class="form-label">

Gender

</label>

<select
id="gender"
class="form-select">

<option value="Male">Male</option>

<option value="Female">Female</option>

</select>

</div>

<div class="col-md-2 mb-3">

<label class="form-label">

Status

</label>

<select
id="status"
class="form-select">

<option value="Active">Active</option>

<option value="Inactive">Inactive</option>

</select>

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Date of Birth

</label>

<input
type="date"
id="dob"
class="form-control">

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Blood Group

</label>

<select
id="bloodGroup"
class="form-select">

<option value="">Select</option>

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>

</select>

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Religion

</label>

<input
type="text"
id="religion"
class="form-control"
value="Islam">

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Birth Certificate No

</label>

<input
type="text"
id="birthCertificate"
class="form-control">

</div> 
<!-- ==========================================
Father Information
========================================== -->

<div class="col-12 mt-4">

<h4 class="border-bottom pb-2">

<i class="fa-solid fa-user-tie"></i>

Father Information

</h4>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Father Name

</label>

<input
type="text"
id="fatherName"
class="form-control">

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Father Mobile

</label>

<input
type="text"
id="fatherMobile"
class="form-control">

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Father Occupation

</label>

<input
type="text"
id="fatherOccupation"
class="form-control">

</div>

<!-- ==========================================
Mother Information
========================================== -->

<div class="col-12 mt-4">

<h4 class="border-bottom pb-2">

<i class="fa-solid fa-person-dress"></i>

Mother Information

</h4>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Mother Name

</label>

<input
type="text"
id="motherName"
class="form-control">

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Mother Mobile

</label>

<input
type="text"
id="motherMobile"
class="form-control">

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Mother Occupation

</label>

<input
type="text"
id="motherOccupation"
class="form-control">

</div>
<!-- ==========================================
Guardian Information
========================================== -->

<div class="col-12 mt-4">

<h4 class="border-bottom pb-2">

<i class="fa-solid fa-user-shield"></i>

Guardian Information

</h4>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Guardian Name

</label>

<input
type="text"
id="guardianName"
class="form-control">

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Relation

</label>

<select
id="guardianRelation"
class="form-select">

<option value="">Select</option>

<option>Father</option>

<option>Mother</option>

<option>Brother</option>

<option>Sister</option>

<option>Uncle</option>

<option>Aunt</option>

<option>Grandfather</option>

<option>Grandmother</option>

<option>Other</option>

</select>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Guardian Mobile

</label>

<input
type="text"
id="guardianMobile"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Emergency Contact

</label>

<input
type="text"
id="emergencyContact"
class="form-control">

</div>

<!-- ==========================================
Address Information
========================================== -->

<div class="col-12 mt-4">

<h4 class="border-bottom pb-2">

<i class="fa-solid fa-location-dot"></i>

Address Information

</h4>

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Village

</label>

<input
type="text"
id="village"
class="form-control">

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Post Office

</label>

<input
type="text"
id="postOffice"
class="form-control">

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Upazila

</label>

<input
type="text"
id="upazila"
class="form-control">

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

District

</label>

<input
type="text"
id="district"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Present Address

</label>

<textarea
id="presentAddress"
class="form-control"
rows="3"></textarea>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Permanent Address

</label>

<textarea
id="permanentAddress"
class="form-control"
rows="3"></textarea>

</div>
 <!-- ==========================================
Fee Information
========================================== -->

<div class="col-12 mt-4">

<h4 class="border-bottom pb-2">

<i class="fa-solid fa-money-bill-wave"></i>

Fee Information

</h4>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Admission Fee

</label>

<input
type="number"
id="admissionFee"
class="form-control"
placeholder="0">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Monthly Fee

</label>

<input
type="number"
id="monthlyFee"
class="form-control"
placeholder="0">

</div>

<div class="col-12 mt-4">

<button
type="submit"
class="btn btn-success btn-lg">

<i class="fa-solid fa-floppy-disk"></i>

Save Student

</button>

<button
type="reset"
class="btn btn-secondary btn-lg ms-2">

<i class="fa-solid fa-rotate"></i>

Reset

</button>

</div>

</div>

</form>

</div>

<!-- ==========================================
Student List
========================================== -->

<div class="dashboard-card mt-4">

<h3>

<i class="fa-solid fa-users"></i>

Student List

</h3>

<div class="row my-3">

<div class="col-md-4">

<input
type="text"
id="searchStudent"
class="form-control"
placeholder="Search by Name / ID / Mobile">

</div>

<div class="col-md-3">

<select
id="departmentFilter"
class="form-select">

<option value="">All Department</option>

<option value="Nurani">Nurani</option>

<option value="Nazera">Nazera</option>

<option value="Hifz">Hifz</option>

<option value="Kitab">Kitab</option>

</select>

</div>

<div class="col-md-3">

<select
id="statusFilter"
class="form-select">

<option value="">All Status</option>

<option value="Active">Active</option>

<option value="Inactive">Inactive</option>

</select>

</div>

<div class="col-md-2">

<button
id="searchBtn"
class="btn btn-primary w-100">

Search

</button>

</div>

</div>

<div class="table-responsive">

<table class="table table-bordered table-hover align-middle">

<thead class="table-dark">

<tr>

<th>Photo</th>

<th>ID</th>

<th>Name</th>

<th>Department</th>

<th>Class</th>

<th>Roll</th>

<th>Mobile</th>

<th>Status</th>

<th width="220">Action</th>

</tr>

</thead>

<tbody id="studentTable">

<tr>

<td colspan="9" class="text-center">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</main>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.3/qrcode.min.js"></script>

<script src="assets/js/students.js"></script>

</body>

</html>
