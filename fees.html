<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fees Management | Madrasa-E Nurul Quran</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="assets/css/admin.css">

<link rel="stylesheet" href="assets/css/fees.css">

</head>

<body>

<div class="dashboard">

<!-- Sidebar -->

<aside class="sidebar">

<div class="brand">

<img src="assets/img/logo.png" alt="Logo">

<h3>মাদরাসায়ে নূরুল কুরআন</h3>

</div>

<ul>

<li><a href="admin.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>

<li><a href="students.html"><i class="fa-solid fa-user-graduate"></i> Students</a></li>

<li><a class="active" href="fees.html"><i class="fa-solid fa-money-bill-wave"></i> Fees</a></li>

<li><a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>

</ul>

</aside>

<!-- Main -->

<main class="main-content">

<div class="topbar">

<h2>Fees Management</h2>

</div>

<!-- Search -->

<div class="dashboard-card">

<div class="row">

<div class="col-md-10">

<input
type="text"
id="studentSearch"
class="form-control"
placeholder="Student ID / Name / Mobile">

</div>

<div class="col-md-2 d-grid">

<button
class="btn btn-success"
id="searchStudent">

Search

</button>

</div>

</div>

</div>

<!-- Student Info -->

<div class="dashboard-card">

<div class="row">

<div class="col-md-2 text-center">

<img
id="studentPhoto"
src="assets/img/avatar.png"
style="width:120px;height:120px;border-radius:50%;object-fit:cover;">

</div>

<div class="col-md-10">

<h4 id="studentName">Student Name</h4>

<p>ID : <span id="studentId">-</span></p>

<p>Father : <span id="fatherName">-</span></p>

<p>Class : <span id="studentClass">-</span></p>

<p>Mobile : <span id="studentMobile">-</span></p>

</div>

</div>

</div>

<!-- Fee Form -->

<div class="dashboard-card">

<form id="feeForm">

<div class="row">

<div class="col-md-3">

<label>Month</label>

<select
id="feeMonth"
class="form-select">

<option>January</option>
<option>February</option>
<option>March</option>
<option>April</option>
<option>May</option>
<option>June</option>
<option>July</option>
<option>August</option>
<option>September</option>
<option>October</option>
<option>November</option>
<option>December</option>

</select>

</div>

<div class="col-md-3">

<label>Fee Type</label>

<select
id="feeType"
class="form-select">

<option>Monthly Fee</option>

<option>Admission Fee</option>

<option>Exam Fee</option>

<option>Hostel Fee</option>

<option>Transport Fee</option>

</select>

</div>

<div class="col-md-2">

<label>Amount</label>

<input
type="number"
id="amount"
class="form-control">

</div>

<div class="col-md-2">

<label>Discount</label>

<input
type="number"
id="discount"
value="0"
class="form-control">

</div>

<div class="col-md-2">

<label>Paid</label>

<input
type="number"
id="paid"
class="form-control">

</div>

</div>

<div class="row mt-3">

<div class="col-md-3">

<label>Due</label>

<input
type="number"
id="due"
class="form-control"
readonly>

</div>

<div class="col-md-3">

<label>Payment Method</label>

<select
id="paymentMethod"
class="form-select">

<option>Cash</option>

<option>bKash</option>

<option>Nagad</option>

<option>Bank</option>

</select>

</div>

<div class="col-md-6">

<label>Remarks</label>

<input
type="text"
id="remarks"
class="form-control">

</div>

</div>

<div class="mt-4">

<button
class="btn btn-success"
type="submit">

Save Payment

</button>

</div>

</form>

</div>
<!-- Payment History -->

<div class="dashboard-card mt-4">

<div class="d-flex justify-content-between align-items-center mb-3">

<h4 class="mb-0">Payment History</h4>

<button
class="btn btn-outline-primary"
id="refreshHistory">

<i class="fa-solid fa-rotate"></i>

Refresh

</button>

</div>

<div class="table-responsive">

<table class="table table-bordered table-hover">

<thead>

<tr>

<th>Receipt</th>

<th>Date</th>

<th>Month</th>

<th>Fee Type</th>

<th>Amount</th>

<th>Discount</th>

<th>Paid</th>

<th>Due</th>

<th>Method</th>

<th>Action</th>

</tr>

</thead>

<tbody id="paymentHistory">

<tr>

<td colspan="10" class="text-center">

No Payment Found

</td>

</tr>

</tbody>

</table>

</div>

</div>

</main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase.js"></script>

<script src="assets/js/fees.js"></script>

</body>

</html>
