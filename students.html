<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Students | Madrasa-E Nurul Quran</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="assets/css/admin.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>

</head>

<body>

<div class="dashboard">

<aside class="sidebar">

<div class="brand">

<img src="assets/img/logo.png">

<h3>মাদরাসায়ে নূরুল কুরআন</h3>

</div>

<ul class="sidebar-menu">

<li><a href="admin.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>

<li><a class="active" href="students.html"><i class="fa-solid fa-user-graduate"></i> Students</a></li>

<li><a href="teachers.html"><i class="fa-solid fa-chalkboard-user"></i> Teachers</a></li>

<li><a href="employees.html"><i class="fa-solid fa-users"></i> Employees</a></li>

<li><a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>

</ul>

</aside>

<main class="main-content">

<div class="dashboard-card">

<h3 class="mb-4">

Student Registration

</h3>

<form id="studentForm" enctype="multipart/form-data">

<div class="row">

<div class="col-md-4 mb-3">

<label>Student ID</label>

<input
type="text"
id="studentID"
class="form-control"
readonly>

</div>

<div class="col-md-8 mb-3">

<label>Full Name</label>

<input
type="text"
id="studentName"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label>Father Name</label>

<input
type="text"
id="fatherName"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Mother Name</label>

<input
type="text"
id="motherName"
class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>Department</label>

<select
id="department"
class="form-select">

<option value="">Select</option>

<option value="Nurani">Nurani</option>

<option value="Nazera">Nazera</option>

<option value="Hifz">Hifz</option>

<option value="Kitab">Kitab</option>

</select>

</div>

<div class="col-md-4 mb-3">

<label>Class</label>

<select
id="studentClass"
class="form-select">

</select>

</div>

<div class="col-md-4 mb-3">

<label>Roll</label>

<input
type="number"
id="roll"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Mobile</label>

<input
type="text"
id="mobile"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Guardian Mobile</label>

<input
type="text"
id="guardianMobile"
class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>Gender</label>

<select
id="gender"
class="form-select">

<option>Male</option>

<option>Female</option>

</select>

</div>

<div class="col-md-4 mb-3">

<label>Date Of Birth</label>

<input
type="date"
id="dob"
class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>Blood Group</label>

<input
type="text"
id="bloodGroup"
class="form-control">

</div> 
<div class="col-md-4 mb-3">

<label>Religion</label>

<input
type="text"
id="religion"
class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>Status</label>

<select
id="status"
class="form-select">

<option value="Active">Active</option>

<option value="Inactive">Inactive</option>

</select>

</div>

<div class="col-md-4 mb-3">

<label>Admission Date</label>

<input
type="date"
id="admissionDate"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Present Address</label>

<textarea
id="presentAddress"
class="form-control"
rows="3"></textarea>

</div>

<div class="col-md-6 mb-3">

<label>Permanent Address</label>

<textarea
id="permanentAddress"
class="form-control"
rows="3"></textarea>

</div>

<div class="col-md-6 mb-3">

<label>Student Photo</label>

<input
type="file"
id="photo"
accept="image/*"
class="form-control">

</div>

<div class="col-md-6 mb-3 d-flex align-items-end">

<button
type="submit"
class="btn btn-success w-100">

<i class="fa-solid fa-floppy-disk"></i>

Save Student

</button>

</div>

</div>

</form>

</div>

<div class="dashboard-card mt-4">

<div class="row mb-3">

<div class="col-md-4">

<input
type="text"
id="searchStudent"
class="form-control"
placeholder="Search Student">

</div>

<div class="col-md-2">

<button
id="searchBtn"
class="btn btn-primary w-100">

Search

</button>

</div>

<div class="col-md-3">

<select
id="departmentFilter"
class="form-select">

<option value="">All Department</option>

<option value="Nurani">Nurani</option>

<option value="Nazera">Nazera</option>

<option value="Hifz">Hifz</option>

<option value="Kitab">Kitab</option>

</select>

</div>

<div class="col-md-3">

<select
id="statusFilter"
class="form-select">

<option value="">All Status</option>

<option value="Active">Active</option>

<option value="Inactive">Inactive</option>

</select>

</div>

</div>
<div class="table-responsive">

<table class="table table-bordered table-hover align-middle">

<thead class="table-dark">

<tr>

<th>Photo</th>

<th>Student ID</th>

<th>Name</th>

<th>Department</th>

<th>Class</th>

<th>Roll</th>

<th>Mobile</th>

<th>Status</th>

<th width="180">Action</th>

</tr>

</thead>

<tbody id="studentTable">

<tr>

<td colspan="9" class="text-center">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</main>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.3/qrcode.min.js"></script>

<script src="assets/js/students.js"></script>

</body>

</html>
