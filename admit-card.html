<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admit Card | Madrasa-E Nurul Quran</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{

background:#f5f5f5;
font-family:Arial,sans-serif;

}

.admit-card{

width:900px;
margin:30px auto;
background:#fff;
border:3px solid #0f4c81;
border-radius:15px;
padding:25px;

}

.header{

display:flex;
align-items:center;
border-bottom:2px solid #0f4c81;
padding-bottom:15px;
margin-bottom:20px;

}

.logo{

width:90px;
height:90px;
margin-right:20px;

}

.title{

flex:1;
text-align:center;

}

.title h2{

margin:0;
color:#0f4c81;
font-weight:bold;

}

.title h5{

margin-top:8px;

}

.photo{

width:140px;
height:170px;
border:2px solid #0f4c81;
object-fit:cover;

}

.info{

margin-top:20px;

}

.info table{

width:100%;

}

.info td{

padding:8px;

}

.qr{

text-align:center;
margin-top:20px;

}

.signature{

margin-top:60px;
display:flex;
justify-content:space-between;

}

.signature div{

text-align:center;
width:220px;
border-top:1px solid #000;
padding-top:8px;

}

.print-btn{

text-align:center;
margin-top:25px;

}

@media print{

.print-btn{

display:none;

}

body{

background:#fff;

}

.admit-card{

border:none;
box-shadow:none;
margin:0;
width:100%;

}

}

</style>

</head>

<body>

<div class="admit-card">

<div class="header">

<img src="assets/img/logo.png" class="logo">

<div class="title">

<h2>মাদরাসায়ে নূরুল কুরআন</h2>

<h5>Examination Admit Card</h5>

</div>

<img id="photo"
src="assets/img/default-user.png"
class="photo">

</div>

<div class="info">

<table class="table table-bordered">

<tr>

<td><b>Student ID</b></td>
<td id="studentID"></td>

<td><b>Department</b></td>
<td id="department"></td>

</tr>

<tr>

<td><b>Name</b></td>
<td id="studentName"></td>

<td><b>Class</b></td>
<td id="studentClass"></td>

</tr>

<tr>

<td><b>Roll</b></td>
<td id="roll"></td>

<td><b>Section</b></td>
<td id="section"></td>

</tr>

<tr>

<td><b>Session</b></td>
<td id="session"></td>

<td><b>Exam</b></td>
<td id="examName">Half Yearly Examination</td>

</tr>

<tr>

<td><b>Exam Date</b></td>
<td id="examDate"></td>

<td><b>Exam Time</b></td>
<td id="examTime">09:00 AM</td>

</tr>

</table>

</div>
<div class="qr">

<img
id="qrCode"
width="140"
height="140">

<p class="mt-2">
Scan for Student Verification
</p>

</div>

<div class="signature">

<div>

Principal Signature

</div>

<div>

Controller of Examination

</div>

</div>

<div class="print-btn">

<button
class="btn btn-primary"
onclick="window.print()">

Print Admit Card

</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.3/qrcode.min.js"></script>

<script src="assets/js/supabase.js"></script>

<script src="assets/js/admit-card.js"></script>

</body>

</html>
