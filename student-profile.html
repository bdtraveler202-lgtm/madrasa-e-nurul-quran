<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Student Profile</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
rel="stylesheet">

<style>

body{

background:#f5f7fb;

}

.profile-card{

max-width:900px;

margin:auto;

margin-top:40px;

background:#fff;

border-radius:15px;

padding:30px;

box-shadow:0 10px 25px rgba(0,0,0,.08);

}

.student-photo{

width:180px;

height:180px;

border-radius:50%;

object-fit:cover;

border:6px solid #198754;

}

.info{

font-size:18px;

margin-bottom:15px;

}

.label{

font-weight:bold;

color:#198754;

}

</style>

</head>

<body>

<div class="container">

<div class="profile-card">

<div class="d-flex justify-content-between align-items-center mb-4">

<h2>

🎓 Student Profile

</h2>

<a
href="students.html"
class="btn btn-success">

← Back

</a>

</div>

<div class="row">

<div class="col-md-4 text-center">

<img

id="studentPhoto"

src="https://placehold.co/200x200?text=Photo"

class="student-photo">

</div>

<div class="col-md-8">

<div class="info">

<span class="label">

Student ID :

</span>

<span id="studentId">

-

</span>

</div>

<div class="info">

<span class="label">

Name :

</span>

<span id="fullName">

-

</span>

</div>

<div class="info">

<span class="label">

Father :

</span>

<span id="fatherName">

-

</span>

</div>

<div class="info">

<span class="label">

Mother :

</span>

<span id="motherName">

-

</span>

</div>

<div class="info">

<span class="label">

Mobile :

</span>

<span id="mobile">

-

</span>

</div>

<div class="info">

<span class="label">

Class :

</span>

<span id="studentClass">

-

</span>

</div>

<div class="info">

<span class="label">

Address :

</span>

<span id="address">

-

</span>

</div>

<div class="info">

<span class="label">

Status :

</span>

<span id="status">

Pending

</span>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/supabase.js"></script>

<script src="assets/student-profile.js"></script>

</body>

</html>
