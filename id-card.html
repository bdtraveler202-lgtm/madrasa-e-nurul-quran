<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ID Card | Madrasa-E Nurul Quran</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{

background:#e9ecef;
font-family:Arial,sans-serif;

}

.id-card{

width:340px;
height:540px;

background:#fff;

margin:30px auto;

border-radius:18px;

overflow:hidden;

box-shadow:0 0 20px rgba(0,0,0,.2);

border:3px solid #0f4c81;

}

.header{

background:#0f4c81;

color:#fff;

text-align:center;

padding:18px;

}

.header img{

width:70px;
height:70px;

margin-bottom:8px;

}

.photo{

width:130px;
height:130px;

border-radius:50%;

border:5px solid #0f4c81;

display:block;

margin:20px auto;

object-fit:cover;

}

.info{

padding:0 25px;

}

.info table{

width:100%;

}

.info td{

padding:6px 0;

font-size:15px;

}

.qr{

text-align:center;

margin-top:18px;

}

.footer{

position:absolute;

bottom:15px;

width:334px;

text-align:center;

font-size:12px;

color:#666;

}

@media print{

body{

background:white;

}

.id-card{

box-shadow:none;

margin:0;

}

}

</style>

</head>

<body>

<div class="id-card">

<div class="header">

<img src="assets/img/logo.png">

<h4>মাদরাসায়ে নূরুল কুরআন</h4>

<small>Student Identity Card</small>

</div>

<img

id="photo"

src="assets/img/default-user.png"

class="photo">

<div class="info">

<table>

<tr>

<td><strong>ID</strong></td>

<td id="studentID"></td>

</tr>

<tr>

<td><strong>Name</strong></td>

<td id="studentName"></td>

</tr>

<tr>

<td><strong>Department</strong></td>

<td id="department"></td>

</tr>

<tr>

<td><strong>Class</strong></td>

<td id="studentClass"></td>

</tr>

<tr>

<td><strong>Roll</strong></td>

<td id="roll"></td>

</tr>

<tr>

<td><strong>Session</strong></td>

<td id="session"></td>

</tr>

<tr>

<td><strong>Mobile</strong></td>

<td id="mobile"></td>

</tr>

</table>

</div>

<div class="qr">

<img

id="qrCode"

width="110">

</div>

<div class="footer">

Madrasa-E Nurul Quran

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase.js"></script>

<script src="assets/js/id-card.js"></script>

</body>

</html>
