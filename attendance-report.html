<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Attendance Report | Madrasa-E Nurul Quran</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="assets/css/admin.css">

<link rel="stylesheet" href="assets/css/attendance-report.css">

</head>

<body>

<div class="dashboard">

<!-- Sidebar -->

<aside class="sidebar">

<div class="brand">

<img src="assets/img/logo.png" alt="Logo">

<h3>মাদরাসায়ে নূরুল কুরআন</h3>

</div>

<ul>

<li><a href="admin.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>

<li><a href="students.html"><i class="fa-solid fa-user-graduate"></i> Students</a></li>

<li><a href="attendance.html"><i class="fa-solid fa-calendar-check"></i> Attendance</a></li>

<li>
<a class="active" href="attendance-report.html">
<i class="fa-solid fa-chart-column"></i>
Attendance Report
</a>
</li>

<li><a href="#" id="logoutBtn">
<i class="fa-solid fa-right-from-bracket"></i>
Logout
</a></li>

</ul>

</aside>

<!-- Main -->

<main class="main-content">

<div class="topbar">

<h2>Attendance Report</h2>

<div>

<button
class="btn btn-success"
id="excelBtn">

<i class="fa-solid fa-file-excel"></i>

Excel

</button>

<button
class="btn btn-danger"
id="pdfBtn">

<i class="fa-solid fa-file-pdf"></i>

PDF

</button>

<button
class="btn btn-primary"
onclick="window.print()">

<i class="fa-solid fa-print"></i>

Print

</button>

</div>

</div>

<div class="dashboard-card">

<div class="row">

<div class="col-md-3">

<label>From Date</label>

<input
type="date"
id="fromDate"
class="form-control">

</div>

<div class="col-md-3">

<label>To Date</label>

<input
type="date"
id="toDate"
class="form-control">

</div>

<div class="col-md-3">

<label>Class</label>

<select
id="reportClass"
class="form-select">

<option value="">All Classes</option>

<option>শিশু</option>
<option>প্রথম</option>
<option>দ্বিতীয়</option>
<option>তৃতীয়</option>
<option>চতুর্থ</option>
<option>পঞ্চম</option>
<option>নাজেরা-১</option>
<option>নাজেরা-২</option>
<option>নাজেরা-৩</option>
<option>হিফজ-১</option>
<option>হিফজ-২</option>

</select>

</div>

<div class="col-md-3 d-grid">

<label>&nbsp;</label>

<button
class="btn btn-success"
id="searchReport">

Generate Report

</button>

</div>

</div>

</div>
<!-- Summary Cards -->

<section class="cards mt-4">

<div class="card-box success">

<div>

<h6>Present</h6>

<h2 id="presentTotal">0</h2>

</div>

<i class="fa-solid fa-user-check"></i>

</div>

<div class="card-box danger">

<div>

<h6>Absent</h6>

<h2 id="absentTotal">0</h2>

</div>

<i class="fa-solid fa-user-xmark"></i>

</div>

<div class="card-box warning">

<div>

<h6>Leave</h6>

<h2 id="leaveTotal">0</h2>

</div>

<i class="fa-solid fa-user-clock"></i>

</div>

<div class="card-box primary">

<div>

<h6>Attendance %</h6>

<h2 id="attendancePercent">0%</h2>

</div>

<i class="fa-solid fa-chart-pie"></i>

</div>

</section>

<!-- Report Table -->

<div class="dashboard-card mt-4">

<div class="table-responsive">

<table class="table table-bordered table-hover">

<thead>

<tr>

<th>SL</th>

<th>Student ID</th>

<th>Name</th>

<th>Class</th>

<th>Date</th>

<th>Status</th>

<th>Remarks</th>

</tr>

</thead>

<tbody id="reportTable">

<tr>

<td colspan="7" class="text-center">

No Report Generated

</td>

</tr>

</tbody>

</table>

</div>

</div>

</main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase.js"></script>

<script src="assets/js/attendance-report.js"></script>

</body>

</html>
