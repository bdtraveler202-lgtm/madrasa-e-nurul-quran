<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Money Receipt | Madrasa-E Nurul Quran</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="assets/css/receipt.css">

</head>

<body>

<div class="container py-4">

<div class="receipt-card">

<div class="text-center mb-4">

<img
src="assets/img/logo.png"
id="logo"
width="90">

<h2 class="mt-3">

মাদরাসায়ে নূরুল কুরআন

</h2>

<p>

Money Receipt

</p>

</div>

<hr>

<div class="row">

<div class="col-md-6">

<p>

<strong>Receipt No :</strong>

<span id="receiptNo"></span>

</p>

<p>

<strong>Date :</strong>

<span id="paymentDate"></span>

</p>

</div>

<div class="col-md-6 text-md-end">

<p>

<strong>Payment Method :</strong>

<span id="paymentMethod"></span>

</p>

</div>

</div>

<hr>

<div class="row">

<div class="col-md-6">

<p>

<strong>Student ID :</strong>

<span id="studentId"></span>

</p>

<p>

<strong>Name :</strong>

<span id="studentName"></span>

</p>

<p>

<strong>Class :</strong>

<span id="studentClass"></span>

</p>

</div>

<div class="col-md-6">

<p>

<strong>Month :</strong>

<span id="feeMonth"></span>

</p>

<p>

<strong>Fee Type :</strong>

<span id="feeType"></span>

</p>

</div>

</div>

<hr>

<table class="table table-bordered">

<thead>

<tr>

<th>Description</th>

<th>Amount</th>

</tr>

</thead>

<tbody>

<tr>

<td>Total Amount</td>

<td id="amount"></td>

</tr>

<tr>

<td>Discount</td>

<td id="discount"></td>

</tr>

<tr>

<td>Paid</td>

<td id="paid"></td>

</tr>

<tr>

<td>Due</td>

<td id="due"></td>

</tr>

</tbody>

</table>

<div class="row mt-5">

<div class="col-6 text-center">

____________________

<br>

Accountant

</div>

<div class="col-6 text-center">

____________________

<br>

Principal

</div>

</div>

<div class="text-center mt-4 no-print">

<button
class="btn btn-primary"
onclick="window.print()">

<i class="fa-solid fa-print"></i>

Print Receipt

</button>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase.js"></script>

<script src="assets/js/receipt.js"></script>

</body>

</html>
