<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher ID Card</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{

background:#e9ecef;
font-family:Arial,sans-serif;

}

.id-card{

width:340px;
height:540px;
margin:30px auto;
background:#fff;
border:3px solid #0f4c81;
border-radius:15px;
overflow:hidden;
position:relative;
box-shadow:0 0 15px rgba(0,0,0,.2);

}

.header{

background:#0f4c81;
color:#fff;
text-align:center;
padding:18px;

}

.header img{

width:70px;
height:70px;
margin-bottom:8px;

}

.photo{

width:130px;
height:130px;
border-radius:50%;
border:4px solid #0f4c81;
display:block;
margin:20px auto;
object-fit:cover;

}

.info{

padding:0 20px;

}

.info table{

width:100%;

}

.info td{

padding:6px 0;
font-size:15px;

}

.qr{

text-align:center;
margin-top:15px;

}

.footer{

position:absolute;
bottom:10px;
width:100%;
text-align:center;
font-size:12px;
color:#666;

}

@media print{

body{

background:#fff;

}

.id-card{

margin:0;
box-shadow:none;

}

}

</style>

</head>

<body>

<div class="id-card">

<div class="header">

<img src="assets/img/logo.png">

<h4>মাদরাসায়ে নূরুল কুরআন</h4>

<small>Teacher Identity Card</small>

</div>

<img
id="photo"
src="assets/img/default-user.png"
class="photo">

<div class="info">

<table>

<tr>

<td><b>ID</b></td>

<td id="teacherID"></td>

</tr>

<tr>

<td><b>Name</b></td>

<td id="teacherName"></td>

</tr>

<tr>

<td><b>Designation</b></td>

<td id="designation"></td>

</tr>

<tr>

<td><b>Department</b></td>

<td id="department"></td>

</tr>

<tr>

<td><b>Mobile</b></td>

<td id="mobile"></td>

</tr>

</table>

</div>
<div class="qr">

<img
id="qrCode"
width="110"
height="110">

</div>

<div class="text-center mt-3">

<button
class="btn btn-primary"
onclick="window.print()">

Print ID Card

</button>

</div>

<div class="footer">

Madrasa-E Nurul Quran

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase.js"></script>

<script src="assets/js/teacher-id.js"></script>

</body>

</html>
