<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Management | Madrasa-E Nurul Quran</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<div class="container-fluid py-4">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3 class="mb-0">

<i class="fa-solid fa-chalkboard-user"></i>

Teacher Management

</h3>

</div>

<div class="card-body">

<form id="teacherForm">

<div class="row">

<div class="col-md-4 mb-3">

<label>Teacher ID</label>

<input
type="text"
id="teacherID"
class="form-control"
readonly>

</div>

<div class="col-md-4 mb-3">

<label>Name</label>

<input
type="text"
id="teacherName"
class="form-control"
required>

</div>

<div class="col-md-4 mb-3">

<label>Designation</label>

<select
id="designation"
class="form-select">

<option>Principal</option>
<option>Vice Principal</option>
<option>Assistant Teacher</option>
<option>Hifz Teacher</option>
<option>Qari</option>

</select>

</div>

<div class="col-md-4 mb-3">

<label>Department</label>

<select
id="department"
class="form-select">

<option>Nurani</option>
<option>Nazera</option>
<option>Hifz</option>

</select>

</div>

<div class="col-md-4 mb-3">

<label>Mobile</label>

<input
type="text"
id="mobile"
class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>Email</label>

<input
type="email"
id="email"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Address</label>

<textarea
id="address"
class="form-control"></textarea>

</div>

<div class="col-md-3 mb-3">

<label>Salary</label>

<input
type="number"
id="salary"
class="form-control">

</div>

<div class="col-md-3 mb-3">

<label>Photo</label>

<input
type="file"
id="photo"
class="form-control">

</div>

</div>

<button
class="btn btn-success"
type="submit">

<i class="fa-solid fa-floppy-disk"></i>

Save Teacher

</button>

</form>

<hr>

<table class="table table-bordered">

<thead>

<tr>

<th>ID</th>

<th>Photo</th>

<th>Name</th>

<th>Department</th>

<th>Designation</th>

<th>Mobile</th>

<th>Salary</th>

<th>Action</th>

</tr>

</thead>

<tbody id="teacherTable">

</tbody>

</table>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase.js"></script>

<script src="assets/js/teacher.js"></script>

</body>

</html>
