<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Employee Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container py-4">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>

<i class="fa-solid fa-users"></i>

Employee Management

</h3>

</div>

<div class="card-body">

<form id="employeeForm">

<div class="row">

<div class="col-md-3 mb-3">

<label>Employee ID</label>

<input
type="text"
id="employeeID"
class="form-control"
readonly>

</div>

<div class="col-md-5 mb-3">

<label>Employee Name</label>

<input
type="text"
id="employeeName"
class="form-control"
required>

</div>

<div class="col-md-4 mb-3">

<label>Photo</label>

<input
type="file"
id="employeePhoto"
class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>Designation</label>

<input
type="text"
id="designation"
class="form-control"
required>

</div>

<div class="col-md-4 mb-3">

<label>Department</label>

<input
type="text"
id="department"
class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>Joining Date</label>

<input
type="date"
id="joiningDate"
class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>Mobile</label>

<input
type="text"
id="mobile"
class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>Email</label>

<input
type="email"
id="email"
class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>Salary</label>

<input
type="number"
id="salary"
class="form-control">

</div>

<div class="col-md-12 mb-3">

<label>Address</label>

<textarea
id="address"
class="form-control"></textarea>

</div>

<div class="col-md-12">

<button
class="btn btn-success"
type="submit">

<i class="fa-solid fa-floppy-disk"></i>

Save Employee

</button>

</div>

</div>

</form>

<hr>

<table class="table table-bordered">

<thead>

<tr>

<th>ID</th>

<th>Photo</th>

<th>Name</th>

<th>Designation</th>

<th>Department</th>

<th>Mobile</th>

<th>Salary</th>

<th>Action</th>

</tr>

</thead>

<tbody id="employeeTable">

<tr>

<td colspan="8"
class="text-center">

No Employee

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase.js"></script>

<script src="assets/js/employee.js"></script>

</body>

</html>
