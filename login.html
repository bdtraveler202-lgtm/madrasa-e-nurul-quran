<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="assets/css/style.css">

<style>

body{

background:#f5f7f2;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.login-card{

width:420px;

background:#fff;

padding:40px;

border-radius:18px;

box-shadow:0 15px 35px rgba(0,0,0,.08);

}

.login-logo{

text-align:center;

margin-bottom:30px;

}

.login-logo img{

width:90px;

height:90px;

object-fit:contain;

margin-bottom:15px;

}

.login-logo h3{

color:#166534;

font-weight:700;

}

.btn-login{

width:100%;

height:48px;

background:#166534;

color:#fff;

border:none;

border-radius:10px;

font-weight:600;

}

.btn-login:hover{

background:#14532d;

}

</style>

</head>

<body>

<div class="login-card">

<div class="login-logo">

<img src="assets/img/logo.png">

<h3>Madrasa Management</h3>

</div>

<form id="loginForm">

<div class="mb-3">

<label>Email</label>

<input
type="email"
id="email"
class="form-control"
required>

</div>

<div class="mb-4">

<label>Password</label>

<input
type="password"
id="password"
class="form-control"
required>

</div>

<button
class="btn-login">

Login

</button>

</form>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase.js"></script>

<script src="assets/js/login.js"></script>

</body>

</html>
