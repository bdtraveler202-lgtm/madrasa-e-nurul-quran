<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Fee Receipt | Madrasa-E Nurul Quran</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f6f9;
font-family:Arial,sans-serif;
}

.receipt{

width:900px;
margin:30px auto;
background:#fff;
padding:30px;
border:3px solid #0f4c81;
border-radius:12px;

}

.header{

display:flex;
align-items:center;
border-bottom:2px solid #0f4c81;
padding-bottom:15px;
margin-bottom:20px;

}

.logo{

width:80px;
height:80px;
margin-right:20px;

}

.title{

flex:1;
text-align:center;

}

.title h2{

margin:0;
color:#0f4c81;
font-weight:bold;

}

.title p{

margin:5px 0 0;

}

.table td{

padding:8px;

}

.amount{

font-size:22px;
font-weight:bold;
color:#198754;

}

.footer{

display:flex;
justify-content:space-between;
margin-top:60px;

}

.sign{

width:220px;
text-align:center;
border-top:1px solid #000;
padding-top:8px;

}

.print{

text-align:center;
margin-top:30px;

}

@media print{

.print{

display:none;

}

body{

background:#fff;

}

.receipt{

margin:0;
width:100%;
border:none;
box-shadow:none;

}

}

</style>

</head>

<body>

<div class="receipt">

<div class="header">

<img src="assets/img/logo.png" class="logo">

<div class="title">

<h2>মাদরাসায়ে নূরুল কুরআন</h2>

<p>Official Money Receipt</p>

</div>

</div>

<table class="table table-bordered">

<tr>

<td><b>Receipt No</b></td>

<td id="receiptNo"></td>

<td><b>Date</b></td>

<td id="paymentDate"></td>

</tr>

<tr>

<td><b>Student ID</b></td>

<td id="studentID"></td>

<td><b>Name</b></td>

<td id="studentName"></td>

</tr>

<tr>

<td><b>Department</b></td>

<td id="department"></td>

<td><b>Class</b></td>

<td id="studentClass"></td>

</tr>

<tr>

<td><b>Fee Type</b></td>

<td id="feeType"></td>

<td><b>Month</b></td>

<td id="feeMonth"></td>

</tr>

<tr>

<td><b>Payment Method</b></td>

<td id="paymentMethod"></td>

<td><b>Status</b></td>

<td>Paid</td>

</tr>

</table> 
<tr>

<td><b>Total Amount</b></td>

<td class="amount" id="amount"></td>

<td><b>Discount</b></td>

<td id="discount"></td>

</tr>

<tr>

<td><b>Paid</b></td>

<td class="amount" id="paid"></td>

<td><b>Due</b></td>

<td id="due"></td>

</tr>

</table>

<div class="text-center mt-4">

<img
id="qrCode"
width="120"
height="120">

<p class="mt-2">

Receipt Verification QR

</p>

</div>

<div class="footer">

<div class="sign">

Accountant

</div>

<div class="sign">

Principal

</div>

</div>

<div class="print">

<button
class="btn btn-primary"
onclick="window.print()">

Print Receipt

</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase.js"></script>

<script src="assets/js/receipt.js"></script>

</body>

</html>
