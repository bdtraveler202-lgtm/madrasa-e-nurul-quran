<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Results | Madrasa-E Nurul Quran</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="assets/css/admin.css">

<link rel="stylesheet" href="assets/css/results.css">

</head>

<body>

<div class="dashboard">

<aside class="sidebar">

<div class="brand">

<img src="assets/img/logo.png">

<h3>মাদরাসায়ে নূরুল কুরআন</h3>

</div>

<ul>

<li><a href="admin.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>

<li><a href="students.html"><i class="fa-solid fa-user-graduate"></i> Students</a></li>

<li><a class="active" href="results.html"><i class="fa-solid fa-square-poll-vertical"></i> Results</a></li>

<li><a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>

</ul>

</aside>

<main class="main-content">

<div class="topbar">

<h2>Result Management</h2>

</div>

<div class="dashboard-card">

<form id="resultForm">

<div class="row">

<div class="col-md-4">

<label>Student ID</label>

<input id="studentId" class="form-control">

</div>

<div class="col-md-4">

<label>Exam Name</label>

<input id="examName" class="form-control">

</div>

<div class="col-md-4">

<label>Subject</label>

<input id="subject" class="form-control">

</div>

</div>

<div class="row mt-3">

<div class="col-md-3">

<label>Full Marks</label>

<input type="number" id="fullMarks" class="form-control">

</div>

<div class="col-md-3">

<label>Pass Marks</label>

<input type="number" id="passMarks" class="form-control">

</div>

<div class="col-md-3">

<label>Obtained Marks</label>

<input type="number" id="obtainedMarks" class="form-control">

</div>

<div class="col-md-3">

<label>Grade</label>

<input id="grade" class="form-control" readonly>

</div>

</div>

<div class="mt-4">

<button class="btn btn-success">

Save Result

</button>

</div>

</form>

</div>
<!-- Result List -->

<div class="dashboard-card mt-4">

<h4>Result History</h4>

<div class="table-responsive">

<table class="table table-bordered table-hover">

<thead>

<tr>

<th>Student ID</th>

<th>Exam</th>

<th>Subject</th>

<th>Marks</th>

<th>Grade</th>

<th>GPA</th>

<th>Date</th>

</tr>

</thead>

<tbody id="resultTable">

<tr>

<td colspan="7" class="text-center">

No Results Found

</td>

</tr>

</tbody>

</table>

</div>

</div>

</main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase.js"></script>

<script src="assets/js/results.js"></script>

</body>

</html>
